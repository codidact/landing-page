name: Publish to Codeberg Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  NODE_VERSION: 22.13.1
  ARTIFACT_NAME: landing-page-staging-build
  ARTIFACT_PATH: dist/

jobs:
  build:
    name: Build landing page
    runs-on: codeberg-tiny-lazy
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - id: build
        uses: ./.github/prepare
        with:
          artifact-name: ${{ env.ARTIFACT_NAME }}
          artifact-path: ${{ env.ARTIFACT_PATH }}
          node-version: ${{ env.NODE_VERSION }}
  # https://docs.codeberg.org/codeberg-pages/forgejo-actions/
  stage:
    name: Deploy staging environment
    runs-on: codeberg-tiny-lazy
    needs: build
    steps:
      - name: Download build artifact
        uses: forgejo/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ env.ARTIFACT_PATH }}
      - name: Deploy landing page
        id: deploy
        uses: actions/git-pages@v2
        with:
          site: 'https://${{ forge.repository_owner }}.codeberg.page/landing-page/'
          token: ${{ forge.token }}
          source: ${{ env.ARTIFACT_PATH }}
