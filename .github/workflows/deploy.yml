name: Deploy to production

on:
  workflow_dispatch:

env:
  ARTIFACT_NAME: landing-page-staging-build
  DEPLOY_SOURCE: deploy/
  DEPLOY_PATH: /www/

jobs:
  deploy:
    name: Deploy production environment
    runs-on: codeberg-tiny-lazy
    env:
      DEPLOY_HOST: ${{ secrets.FTP_HOST }}
      DEPLOY_USER: ${{ secrets.FTP_USER }}
      DEPLOY_PASS: ${{ secrets.FTP_PASS }}
    steps:
      # TODO: switch to download-artifact when forgejo/forgejo#8004 is fixed
      - name: Download build artifact
        uses: actions/cache/restore@v5
        with:
          key: ${{ env.ARTIFACT_NAME }}
          fail-on-cache-miss: true
          path: ${{ env.DEPLOY_SOURCE }}
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq sshpass
      - name: Deploy build artifact
        run: |
          echo "ls -1" | sshpass -v -p "$DEPLOY_PASS" \
                         sftp -o "StrictHostKeyChecking no" \
                              -o "PubkeyAuthentication no" \
                              -o "PasswordAuthentication yes" \
                              "$DEPLOY_USER"@"$DEPLOY_HOST:$DEPLOY_PATH"
